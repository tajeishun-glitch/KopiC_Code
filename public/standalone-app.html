                    <div className="bg-white rounded-xl border border-slate-200 p-5 flex flex-wrap items-center justify-between gap-4">
                      <div>
                        <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-teal-100 text-teal-900">ACTIVE ROLE: {currentUser.role}</span>
                        <h2 className="text-xl font-extrabold mt-1">{project.name}</h2>
                        <p className="text-xs text-slate-500">PM: {project.pm} • Planned: {project.plannedCompletion}% vs Actual: {project.actualCompletion}% ({project.status})</p>
                      </div>
                      <div className="flex gap-2 text-xs">
                        <button onClick={() => setTab("M01_SCANNER")} className="px-3 py-2 bg-teal-600 text-white rounded-lg font-bold">📸 Scan Product Image (M01)</button>
                        <button onClick={() => setTab("M03_QUALITY")} className="px-3 py-2 bg-rose-600 text-white rounded-lg font-bold">⚠ Log Vendor Defect (M03)</button>
                        <button onClick={() => setTab("M06_COPILOT")} className="px-3 py-2 bg-indigo-600 text-white rounded-lg font-bold">🤖 AI Risk Simulator (M06)</button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
                      <div className="bg-white p-4 rounded-xl border border-slate-200"><div className="text-slate-500">Schedule Progress (M05)</div><div className="text-2xl font-extrabold mt-1">{project.actualCompletion}% <span className="text-xs font-normal">/ {project.plannedCompletion}%</span></div><div className="text-rose-600 font-bold mt-1">-9% Variance (Structural Work)</div></div>
                      <div className="bg-white p-4 rounded-xl border border-slate-200"><div className="text-slate-500">Critical Stock Shortages (M02)</div><div className="text-2xl font-extrabold text-rose-600 mt-1">2 Materials</div><div className="text-slate-600 mt-1">T16 Rebar (3.0d cover) & Cement (&lt;200 ROP)</div></div>
                      <div className="bg-white p-4 rounded-xl border border-slate-200"><div className="text-slate-500">Vendor Evaluation Alert (M03)</div><div className="text-2xl font-extrabold text-amber-600 mt-1">Apex Steel: 54.4%</div><div className="text-rose-700 font-bold mt-1">DO_NOT_REHIRE (24 MT Corroded)</div></div>
                      <div className="bg-white p-4 rounded-xl border border-slate-200"><div className="text-slate-500">Critical AI Risks (M06)</div><div className="text-2xl font-extrabold text-indigo-700 mt-1">Score 25/25</div><div className="text-slate-600 mt-1">2-Day Steel Shortage Gap Predicted</div></div>
                    </div>
                  </div>
                )}

                {tab === "M01_SCANNER" && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div className="lg:col-span-5 bg-white p-5 rounded-xl border border-slate-200 space-y-4">
                      <h3 className="font-bold text-base">M01: Upload / Select Material Photo</h3>
                      <div className="grid grid-cols-2 gap-2 text-xs">
                        {MATERIALS.map(m => (
                          <button key={m.materialCode} onClick={() => setScanMatCode(m.materialCode)} className={`p-2.5 rounded-lg border text-left ${scanMatCode === m.materialCode ? "border-teal-600 bg-teal-50 font-bold" : "border-slate-200"}`}>
                            <div className="text-teal-700">{m.materialCode}</div>
                            <div className="truncate">{m.name}</div>
                          </button>
                        ))}
                      </div>
                      <img src={scannedMat.imageUrl} className="w-full h-48 object-cover rounded-xl border" />
                      <div className="p-3 rounded-lg bg-amber-50 border border-amber-200 text-xs text-amber-900">
                        <strong>BR-002 & BR-003:</strong> AI confidence 95.8%. Visual ID confirmed; verify mill/batch certs for structural compliance.
                      </div>
                    </div>

                    <div className="lg:col-span-7 space-y-4">
                      <div className="bg-white p-5 rounded-xl border border-slate-200 space-y-2 text-xs">
                        <div className="text-teal-700 font-bold uppercase">1. AI Material Identification</div>
                        <div className="text-lg font-extrabold">{scannedMat.name} ({scannedMat.materialCode})</div>
                        <div><strong>Specs:</strong> {scannedMat.specifications}</div>
                      </div>

                      <div className="bg-white p-5 rounded-xl border-2 border-teal-500/40 space-y-2 text-xs">
                        <div className="text-teal-700 font-bold uppercase">2. Automatic Live Stock Check on Image Upload ({projectCode})</div>
                        {scannedInv && scannedMetrics ? (
                          <div className="grid grid-cols-4 gap-2 text-center pt-1">
                            <div className="p-2.5 bg-slate-50 rounded border"><div className="text-slate-500">Available Stock</div><div className="text-base font-extrabold text-teal-900">{scannedMetrics.available} {scannedMat.unit}</div></div>
                            <div className="p-2.5 bg-slate-50 rounded border"><div className="text-slate-500">Reorder Point</div><div className="text-base font-bold">{scannedMetrics.rop} {scannedMat.unit}</div></div>
                            <div className="p-2.5 bg-slate-50 rounded border"><div className="text-slate-500">Stock Coverage</div><div className="text-base font-extrabold text-rose-700">{scannedMetrics.coverage} days</div></div>
                            <div className="p-2.5 bg-slate-50 rounded border"><div className="text-slate-500">Status</div><div className="font-bold text-rose-700">{scannedMetrics.status}</div></div>
                          </div>
                        ) : <div>No stock record at {projectCode}.</div>}
                      </div>

                      <div className="bg-white p-5 rounded-xl border border-slate-200 space-y-2 text-xs">
                        <div className="flex justify-between"><span className="text-teal-700 font-bold uppercase">3. Automatic Vendor Stock, Price & Defect Evaluation Check</span><span className="font-mono text-amber-800 bg-amber-100 px-2 py-0.5 rounded">SIMULATED (BR-018)</span></div>
                        <table className="w-full text-left border-collapse mt-2">
                          <thead><tr className="border-b bg-slate-50"><th className="p-2">Vendor</th><th className="p-2">Price</th><th className="p-2">External Stock</th><th className="p-2">Lead Time</th><th className="p-2">Evaluation Score (M03)</th></tr></thead>
                          <tbody>
                            {vendors.filter(v => v.products.some(p => p.materialCode === scanMatCode)).map(v => {
                              const p = v.products.find(pr => pr.materialCode === scanMatCode);
                              return (
                                <tr key={v.vendorCode} className="border-b">
                                  <td className="p-2 font-bold">{v.name} ({v.vendorCode})</td>
                                  <td className="p-2 font-bold">RM {p.unitPriceRm}/{scannedMat.unit}</td>
                                  <td className="p-2 text-teal-800 font-semibold">{p.availableExternalQty} {scannedMat.unit}</td>
                                  <td className="p-2">{p.leadTimeDays} days</td>
                                  <td className="p-2"><span className={`px-2 py-0.5 rounded font-bold ${v.performance.evaluationStatus === "PREFERRED" ? "bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-800"}`}>{v.performance.overallScore}% ({v.performance.evaluationStatus})</span></td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {tab === "M02_INVENTORY" && (
                  <div className="bg-white p-6 rounded-xl border border-slate-200 space-y-4 text-xs">
                    <h2 className="text-lg font-bold">M02: Smart Live Stock Inventory — {projectCode} (Available = Current − Reserved; Incoming Separate)</h2>
                    <table className="w-full text-left border-collapse">
                      <thead><tr className="bg-slate-100 border-b"><th className="p-2.5">Material</th><th className="p-2.5">Current</th><th className="p-2.5">Reserved</th><th className="p-2.5 bg-teal-50">Available</th><th className="p-2.5">Incoming (Separate)</th><th className="p-2.5">Daily Burn</th><th className="p-2.5">Reorder Point</th><th className="p-2.5">Coverage Days</th><th className="p-2.5">Quick Action</th></tr></thead>
                      <tbody>
                        {inventory.filter(i => i.projectCode === projectCode).map(inv => {
                          const m = calcInv(inv);
                          const mat = MATERIALS.find(mt => mt.materialCode === inv.materialCode);
                          return (
                            <tr key={inv.id} className="border-b">
                              <td className="p-2.5 font-bold">{mat?.name} ({inv.materialCode})</td>
                              <td className="p-2.5">{inv.currentStock}</td>
                              <td className="p-2.5">{inv.reservedStock}</td>
                              <td className="p-2.5 bg-teal-50 font-extrabold text-teal-900">{m.available} {mat?.unit}</td>
                              <td className="p-2.5 text-blue-700 font-semibold">+{inv.incomingStock}</td>
                              <td className="p-2.5">{inv.avgDailyConsumption}/day</td>
                              <td className="p-2.5 font-bold">{m.rop}</td>
                              <td className="p-2.5 font-extrabold">{m.coverage} days ({m.status})</td>
                              <td className="p-2.5">
                                <button onClick={() => setInventory(inventory.map(x => x.id === inv.id ? { ...x, currentStock: Math.max(0, x.currentStock - 20) } : x))} className="px-2 py-1 bg-amber-600 text-white rounded font-bold mr-1">-20 Consume</button>
                                <button onClick={() => setInventory(inventory.map(x => x.id === inv.id ? { ...x, currentStock: x.currentStock + 50 } : x))} className="px-2 py-1 bg-emerald-600 text-white rounded font-bold">+50 Receipt</button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}

                {tab === "M03_QUALITY" && (
                  <div className="space-y-6 text-xs">
                    <div className="bg-white p-6 rounded-xl border border-slate-200 space-y-3">
                      <h2 className="text-lg font-bold">M03: Live Vendor Performance Scorecard (40% Delivery + 40% Quality + 20% Resolution)</h2>
                      <table className="w-full text-left border-collapse">
                        <thead><tr className="bg-slate-100 border-b"><th className="p-2.5">Vendor</th><th className="p-2.5">Overall Score</th><th className="p-2.5">On-Time %</th><th className="p-2.5">Quality Acceptance %</th><th className="p-2.5">Open Defects</th><th className="p-2.5">Future Tender Status</th><th className="p-2.5">AI Risk Insight</th></tr></thead>
                        <tbody>
                          {vendors.map(v => (
                            <tr key={v.vendorCode} className="border-b">
                              <td className="p-2.5 font-bold">{v.name} ({v.vendorCode})</td>
                              <td className="p-2.5 text-sm font-extrabold">{v.performance.overallScore}%</td>
                              <td className="p-2.5">{v.performance.onTimeDeliveryRate}%</td>
                              <td className="p-2.5">{v.performance.qualityAcceptanceRate}%</td>
                              <td className="p-2.5 font-bold text-rose-700">{v.performance.openDefectsCount}</td>
                              <td className="p-2.5"><span className={`px-2 py-0.5 rounded font-bold ${v.performance.evaluationStatus === "PREFERRED" ? "bg-emerald-100 text-emerald-800" : v.performance.evaluationStatus === "WATCHLIST" ? "bg-amber-100 text-amber-800" : "bg-rose-100 text-rose-800"}`}>{v.performance.evaluationStatus}</span></td>
                              <td className="p-2.5 text-slate-600">{v.performance.aiRiskSummary}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                      <div className="lg:col-span-5 bg-white p-5 rounded-xl border border-slate-200 space-y-3">
                        <h3 className="font-bold text-sm text-rose-700">Worker & Engineer Defect Reflection Form (TC-008)</h3>
                        <select value={defVendor} onChange={e => setDefVendor(e.target.value)} className="w-full border rounded p-2">
                          {vendors.map(v => <option key={v.vendorCode} value={v.vendorCode}>{v.vendorCode} – {v.name}</option>)}
                        </select>
                        <select value={defMat} onChange={e => setDefMat(e.target.value)} className="w-full border rounded p-2">
                          {MATERIALS.map(m => <option key={m.materialCode} value={m.materialCode}>{m.materialCode} – {m.name}</option>)}
                        </select>
                        <input type="number" value={defRejQty} onChange={e => setDefRejQty(e.target.value)} className="w-full border rounded p-2" placeholder="Rejected Qty" />
                        <textarea rows="2" value={defDesc} onChange={e => setDefDesc(e.target.value)} className="w-full border rounded p-2" />
                        <button onClick={handleLogDefect} className="w-full py-2 bg-rose-600 text-white font-bold rounded-lg">Submit Defect & Auto-Recalculate Vendor Score</button>
                      </div>
                      <div className="lg:col-span-7 bg-white p-5 rounded-xl border border-slate-200 space-y-2">
                        <h3 className="font-bold text-sm">Logged Site Defects ({defects.length})</h3>
                        {defects.map(d => (
                          <div key={d.defectCode} className="p-3 rounded-lg bg-slate-50 border space-y-1">
                            <div className="flex justify-between font-bold"><span>{d.defectCode} • Vendor {d.vendorCode} • {d.category}</span><span className="text-rose-600">{d.severity} (Rejected: {d.rejectedQty})</span></div>
                            <p>{d.description}</p>
                            <div className="text-slate-500">Reported by: {d.reportedBy} on {d.reportedDate}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {tab === "M04_EQUIPMENT" && (
                  <div className="bg-white p-6 rounded-xl border border-slate-200 space-y-4 text-xs">
                    <h2 className="text-lg font-bold">M04: On-Site Tools & Equipment QR Management (Conflict Check BR-012 / TC-022)</h2>
                    {eqMsg && <div className="p-3 rounded-lg bg-amber-50 border border-amber-300 font-bold text-amber-900">{eqMsg}</div>}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      {equipments.map(eq => (
                        <div key={eq.equipmentCode} className="p-4 rounded-xl border bg-slate-50 space-y-2">
                          <div className="flex justify-between items-center">
                            <span className="font-bold text-sm">{eq.name} ({eq.equipmentCode})</span>
                            <span className={`px-2 py-0.5 rounded font-bold ${eq.status === "AVAILABLE" ? "bg-emerald-100 text-emerald-800" : eq.status === "DAMAGED" ? "bg-rose-100 text-rose-800" : "bg-blue-100 text-blue-800"}`}>{eq.status}</span>
                          </div>
                          <div>Project: <strong>{eq.currentProjectCode}</strong> • Location: {eq.currentLocation}</div>
                          <div>Assigned: {eq.assignedTo || "Available"} • {eq.maintenanceNote}</div>
                          <div className="flex gap-2 pt-1">
                            <button onClick={() => {
                              if (eq.status !== "AVAILABLE") { setEqMsg(`BR-012 & TC-022 Conflict Prevented: ${eq.equipmentCode} is already ${eq.status}! Cannot double-allocate.`); return; }
                              setEquipments(equipments.map(x => x.equipmentCode === eq.equipmentCode ? { ...x, status: "IN_USE", assignedTo: `${currentUser.name} Team` } : x));
                              setEqMsg(`✓ Allocated ${eq.equipmentCode} to ${currentUser.name} Team.`);
                            }} className="px-2.5 py-1 bg-teal-600 text-white rounded font-bold">Allocate (TC-012)</button>
                            <button onClick={() => {
                              setEquipments(equipments.map(x => x.equipmentCode === eq.equipmentCode ? { ...x, status: "AVAILABLE", assignedTo: "" } : x));
                              setEqMsg(`✓ Returned ${eq.equipmentCode} to AVAILABLE status (TC-013).`);
                            }} className="px-2.5 py-1 bg-slate-800 text-white rounded font-bold">Return (TC-013)</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {tab === "M05_PROGRESS" && (
                  <div className="bg-white p-6 rounded-xl border border-slate-200 space-y-4 text-xs">
                    <h2 className="text-lg font-bold">M05: Visual Project & Subcontractor Progress — {projectCode}</h2>
                    <div className="p-3.5 rounded-xl bg-amber-50 border border-amber-300 text-amber-950">
                      <strong>⚠ FR-M05-008 Governance Rule:</strong> Overall budget burn (67.3%) exceeds actual completion (56%). Higher spending vs completion is <strong>flagged for investigation</strong> (rework on Grid C4-C7 vs front-loaded procurement) rather than automatically classified as material wastage.
                    </div>
                    <div className="space-y-3">
                      {milestones.filter(m => m.projectCode === projectCode).map(ms => (
                        <div key={ms.milestoneCode} className="p-4 rounded-xl border bg-slate-50 space-y-2">
                          <div className="flex justify-between font-bold text-sm">
                            <span>{ms.name} ({ms.milestoneCode}) — Subcon: {ms.subcontractorName}</span>
                            <span className={ms.actualProgress < ms.plannedProgress ? "text-rose-600" : "text-emerald-700"}>Planned: {ms.plannedProgress}% | Actual: {ms.actualProgress}%</span>
                          </div>
                          <div className="h-2.5 w-full bg-slate-200 rounded-full overflow-hidden"><div className="h-full bg-teal-600" style={{ width: `${ms.actualProgress}%` }}></div></div>
                          <button onClick={() => setMilestones(milestones.map(x => x.milestoneCode === ms.milestoneCode ? { ...x, actualProgress: Math.min(100, x.actualProgress + 5) } : x))} className="px-3 py-1 bg-teal-600 text-white rounded font-bold">+5% Update Daily Progress (TC-015)</button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {tab === "M06_COPILOT" && (
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 text-xs">
                    <div className="lg:col-span-6 bg-white p-5 rounded-xl border border-slate-200 space-y-3">
                      <span className="text-indigo-700 font-bold uppercase">FR-M06-007 & BR-020 • Interactive What-If Scenario Simulator</span>
                      <h3 className="text-base font-bold">Simulate Delayed Delivery Impact (Non-Mutating Sandbox)</h3>
                      <select value={simMat} onChange={e => setSimMat(e.target.value)} className="w-full border rounded p-2 font-bold">
                        <option value="STL-002">STL-002 – High-Tensile Steel Rebar T16 (300 MT Available, 100 MT/d burn)</option>
                        <option value="CEM-001">CEM-001 – Portland Cement (170 bags Available, 50 bags/d burn)</option>
                      </select>
                      <label className="block font-bold">Simulate Additional Delivery Delay: +{simDelay} Days</label>
                      <input type="range" min="1" max="10" value={simDelay} onChange={e => setSimDelay(Number(e.target.value))} className="w-full accent-indigo-600" />
                      <div className="p-4 rounded-xl bg-indigo-50 border border-indigo-200 space-y-2">
                        <div className="font-extrabold text-sm text-indigo-950">Simulated Result: {simDelay + 2}-Day Stockout Gap (Risk Score: 25/25 CRITICAL)</div>
                        <p>Available stock covers <strong>3.0 days</strong>. With a +{simDelay}-day delay, total wait reaches {5 + simDelay} days, halting Structural Work (MS-ALPHA-02) and exposing <strong>RM {((simDelay + 2) * 24000).toLocaleString()}</strong> in idle crane/crew standby cost.</p>
                        <div className="font-bold text-teal-900">AI Recommended Mitigations: 1) Transfer 200 MT surplus from Project Beta (850 MT available). 2) Issue split order to Preferred Vendor MetroSteel (V003, 96.6% score, 2-day lead time).</div>
                        <div className="text-[10px] text-slate-500">Explainable AI (FR-M06-009): Uses live M02 inventory & M03 vendor records. Actual DB records unmodified (BR-020).</div>
                      </div>
                    </div>
                    <div className="lg:col-span-6 bg-white p-5 rounded-xl border border-slate-200 space-y-3">
                      <span className="text-rose-700 font-bold uppercase">FR-M06-002 to FR-M06-006 • Cross-Module Active Risks</span>
                      <div className="p-3.5 rounded-xl border bg-rose-50/50 space-y-1">
                        <div className="font-bold text-rose-900">[CRITICAL 25/25] RSK-ALPHA-001: T16 Steel Rebar 2-Day Shortage Gap</div>
                        <p>300 MT available covers 3.0 days at 100 MT/day vs 5-day delivery lead time.</p>
                      </div>
                      <div className="p-3.5 rounded-xl border bg-rose-50/50 space-y-1">
                        <div className="font-bold text-rose-900">[CRITICAL 20/25] RSK-ALPHA-002: Vendor Apex Steel (V002) Chronic Delays & 29% Reject Rate</div>
                        <p>Score dropped to 54.4% (DO_NOT_REHIRE) after 24 MT corroded rebar rejected by worker Muthu Krishnan.</p>
                      </div>
                      <div className="p-3.5 rounded-xl border bg-amber-50/50 space-y-1">
                        <div className="font-bold text-amber-900">[HIGH 16/25] RSK-ALPHA-004: Rebar Bender EQ-RB-004 Damaged & Excavator Service Overdue</div>
                        <p>On-site rebar fabrication reduced by 40%; transfer idle Excavator EQ-EX-007 from PRJ-BETA.</p>
                      </div>
                    </div>
                  </div>
                )}
              </>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
